[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-audit"
version = "2.0.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Read-only GCP resource, cost and last-used table for an academic lab estate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2.23",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
gca = "gcp_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
# Test this tree, not whatever an editable install points at (tests/test_suite_provenance.py).
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "A", "I", "UP", "B"]
ignore = ["E501", "A002", "B008"]
